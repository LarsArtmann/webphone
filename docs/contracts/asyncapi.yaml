asyncapi: 3.0.0
id: urn:webphonewirecontracts:api
info:
    title: webphone wire contracts
    version: 1.0.0
    description: 'Generated from the handler wire types (go-cqrs-lite/catalog). The lanes are plain HTTPS calls: the telephony stack POSTs the /hooks/* channels with the Bearer gateway secret, and webphone''s browser clients live on the /events SSE stream.'
defaultContentType: application/json
channels:
    commands.wire.hooks.fax:
        address: webphone-wire.commands.wire.hooks.fax
        title: Inbound Fax Hook command Channel
        description: POST /hooks/fax — inbound fax document (base64 PDF) from the bridge. Bearer gateway secret.
        messages:
            command.wire.hooks.fax:
                $ref: '#/components/messages/command.wire.hooks.fax'
    commands.wire.hooks.fax.status:
        address: webphone-wire.commands.wire.hooks.fax.status
        title: Fax Status Hook command Channel
        description: POST /hooks/fax/status — outbound fax verdict from the provider (transmitted | failed). Bearer gateway secret; idempotent (1 h window).
        messages:
            command.wire.hooks.fax.status:
                $ref: '#/components/messages/command.wire.hooks.fax.status'
    commands.wire.hooks.message:
        address: webphone-wire.commands.wire.hooks.message
        title: Inbound Message Hook command Channel
        description: POST /hooks/message — inbound SMS/MMS from the stack's Telnyx bridge. Persists into the owner's thread, nudges the SSE surfaces, auto-unarchives. Bearer gateway secret; status answers are idempotent (1 h window; replays answer 202).
        messages:
            command.wire.hooks.message:
                $ref: '#/components/messages/command.wire.hooks.message'
    commands.wire.hooks.message.status:
        address: webphone-wire.commands.wire.hooks.message.status
        title: Message Status Hook command Channel
        description: POST /hooks/message/status — outbound message verdict from the provider (delivered | failed). Bearer gateway secret; idempotent (1 h window).
        messages:
            command.wire.hooks.message.status:
                $ref: '#/components/messages/command.wire.hooks.message.status'
    commands.wire.hooks.ring:
        address: webphone-wire.commands.wire.hooks.ring
        title: Ring Hook command Channel
        description: POST /hooks/ring — inbound-call wake from the stack's FS dialplan (ring-while-closed seam). Fans a push out to the owner's registered devices; state "end" stands them down. Answers 202 inertly whether or not push is configured — the dialplan must never wait on push health. Bearer gateway secret; fail-closed 503 without one.
        messages:
            command.wire.hooks.ring:
                $ref: '#/components/messages/command.wire.hooks.ring'
    events.wire.gateway.receipt:
        address: webphone-wire.events.wire.gateway.receipt
        title: Gateway Receipt event Channel
        description: 'The acceptance receipt the bridge answers webphone''s webhook POST with: the provider_ref to address later status hooks at. A small non-JSON answer is taken verbatim as the ref (the bare-token alternative); the receipt only ever acknowledges acceptance — settlement waits for the status hook.'
        messages:
            event.wire.gateway.receipt:
                $ref: '#/components/messages/event.wire.gateway.receipt'
    events.wire.sse.contacts:
        address: webphone-wire.events.wire.sse.contacts
        title: SSE contacts event Channel
        description: 'GET /events event "contacts": payload-less nudge — the panel re-fetches.'
        messages:
            event.wire.sse.contacts:
                $ref: '#/components/messages/event.wire.sse.contacts'
    events.wire.sse.fax:
        address: webphone-wire.events.wire.sse.fax
        title: SSE fax event Channel
        description: 'GET /events event "fax": the fax list re-renders.'
        messages:
            event.wire.sse.fax:
                $ref: '#/components/messages/event.wire.sse.fax'
    events.wire.sse.thread:
        address: webphone-wire.events.wire.sse.thread
        title: SSE thread event Channel
        description: 'GET /events event "thread": one open conversation''s transcript re-renders.'
        messages:
            event.wire.sse.thread:
                $ref: '#/components/messages/event.wire.sse.thread'
    events.wire.sse.threads:
        address: webphone-wire.events.wire.sse.threads
        title: SSE threads event Channel
        description: 'GET /events event "threads": the thread LIST morphs (list-only by design — a zero thread id never pushes the transcript, so an open conversation is never wiped).'
        messages:
            event.wire.sse.threads:
                $ref: '#/components/messages/event.wire.sse.threads'
    events.wire.sse.voicemail:
        address: webphone-wire.events.wire.sse.voicemail
        title: SSE voicemail event Channel
        description: 'GET /events event "voicemail": payload-less nudge — the panel re-fetches.'
        messages:
            event.wire.sse.voicemail:
                $ref: '#/components/messages/event.wire.sse.voicemail'
operations:
    publishwire.sse.contacts:
        title: Publish SSE contacts
        summary: 'GET /events event "contacts": payload-less nudge — the panel re-fetches.'
        action: send
        channel:
            $ref: '#/channels/events.wire.sse.contacts'
        messages:
            -   $ref: '#/channels/events.wire.sse.contacts/messages/event.wire.sse.contacts'
        tags:
            -   name: events
            -   name: webphone-wire
    publishwire.sse.fax:
        title: Publish SSE fax
        summary: 'GET /events event "fax": the fax list re-renders.'
        action: send
        channel:
            $ref: '#/channels/events.wire.sse.fax'
        messages:
