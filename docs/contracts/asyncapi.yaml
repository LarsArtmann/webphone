        messages:
            -   $ref: '#/channels/events.wire.sse.thread/messages/event.wire.sse.thread'
        tags:
            -   name: events
            -   name: webphone-wire
    publishwire.sse.threads:
        title: Publish SSE threads
        summary: 'GET /events event "threads": the thread LIST morphs (list-only by design — a zero thread id never pushes the transcript, so an open conversation is never wiped).'
        action: send
        channel:
            $ref: '#/channels/events.wire.sse.threads'
        messages:
            -   $ref: '#/channels/events.wire.sse.threads/messages/event.wire.sse.threads'
        tags:
            -   name: events
            -   name: webphone-wire
    publishwire.sse.voicemail:
        title: Publish SSE voicemail
        summary: 'GET /events event "voicemail": payload-less nudge — the panel re-fetches.'
        action: send
        channel:
            $ref: '#/channels/events.wire.sse.voicemail'
        messages:
            -   $ref: '#/channels/events.wire.sse.voicemail/messages/event.wire.sse.voicemail'
        tags:
            -   name: events
            -   name: webphone-wire
    receivewire.gateway.receipt:
        title: Publish Gateway Receipt
        summary: 'The acceptance receipt the bridge answers webphone''s webhook POST with: the provider_ref to address later status hooks at. A small non-JSON answer is taken verbatim as the ref (the bare-token alternative); the receipt only ever acknowledges acceptance — settlement waits for the status hook.'
        action: receive
        channel:
            $ref: '#/channels/events.wire.gateway.receipt'
        messages:
            -   $ref: '#/channels/events.wire.gateway.receipt/messages/event.wire.gateway.receipt'
        tags:
            -   name: events
            -   name: webphone-wire
    receivewire.hooks.fax:
        title: Receive Inbound Fax Hook
        summary: POST /hooks/fax — inbound fax document (base64 PDF) from the bridge. Bearer gateway secret.
        action: receive
        channel:
            $ref: '#/channels/commands.wire.hooks.fax'
        messages:
            -   $ref: '#/channels/commands.wire.hooks.fax/messages/command.wire.hooks.fax'
        tags:
            -   name: commands
            -   name: webphone-wire
            -   name: http:POST
    receivewire.hooks.fax.status:
        title: Receive Fax Status Hook
        summary: POST /hooks/fax/status — outbound fax verdict from the provider (transmitted | failed). Bearer gateway secret; idempotent (1 h window).
        action: receive
        channel:
            $ref: '#/channels/commands.wire.hooks.fax.status'
        messages:
            -   $ref: '#/channels/commands.wire.hooks.fax.status/messages/command.wire.hooks.fax.status'
        tags:
            -   name: commands
            -   name: webphone-wire
            -   name: http:POST
    receivewire.hooks.message:
        title: Receive Inbound Message Hook
        summary: POST /hooks/message — inbound SMS/MMS from the stack's Telnyx bridge. Persists into the owner's thread, nudges the SSE surfaces, auto-unarchives. Bearer gateway secret; status answers are idempotent (1 h window; replays answer 202).
        action: receive
        channel:
            $ref: '#/channels/commands.wire.hooks.message'
        messages:
            -   $ref: '#/channels/commands.wire.hooks.message/messages/command.wire.hooks.message'
        tags:
            -   name: commands
            -   name: webphone-wire
            -   name: http:POST
    receivewire.hooks.message.status:
        title: Receive Message Status Hook
        summary: POST /hooks/message/status — outbound message verdict from the provider (delivered | failed). Bearer gateway secret; idempotent (1 h window).
        action: receive
        channel:
            $ref: '#/channels/commands.wire.hooks.message.status'
        messages:
            -   $ref: '#/channels/commands.wire.hooks.message.status/messages/command.wire.hooks.message.status'
        tags:
            -   name: commands
            -   name: webphone-wire
            -   name: http:POST
    receivewire.hooks.ring:
        title: Receive Ring Hook
        summary: POST /hooks/ring — inbound-call wake from the stack's FS dialplan (ring-while-closed seam). Fans a push out to the owner's registered devices; state "end" stands them down. Answers 202 inertly whether or not push is configured — the dialplan must never wait on push health. Bearer gateway secret; fail-closed 503 without one.
        action: receive
        channel:
            $ref: '#/channels/commands.wire.hooks.ring'
        messages:
            -   $ref: '#/channels/commands.wire.hooks.ring/messages/command.wire.hooks.ring'
        tags:
            -   name: commands
            -   name: webphone-wire
            -   name: http:POST
