name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # The forward-pin enabler: proves vendorHash + build of the exact rev.
  # Consumers relock this repo's main on trust; without this job "green
  # at HEAD" is unproven (the 2026-09-24 stale-vendorHash class arrived
  # via a relock and only failed downstream).
  build:
    name: nix build .#webphone
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - name: Build the webphone binary
        run: nix build -L .#webphone

  # Go unit/contract tests (cmd + internal). The minimal `ci` devShell
  # provides Go at the go.mod floor; GOTOOLCHAIN=local (set in that
  # shell) forbids surprise toolchain downloads inside the hermetic shell.
  go-tests:
    name: go test -race ./...
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - name: Run the Go test suite
        run: nix develop .#ci -c go test -race ./...

  # Fast flake checks without the VM suites (module-check/vm-tests stay
  # consumer-side; they need KVM and tens of minutes).
  #
  # island-typecheck belongs HERE, not only in a full `nix flake check`:
  # until 2026-10-28 the type gate was green locally and unwired in CI, so
  # a contributor's `go test ./...` and the CI run both stayed ignorant of a
  # red served asset (`typecheck_pin_test.go` guards the CONFIG, never the
  # compiler verdict).
  fast-checks:
    name: fast flake checks (format, island, lints)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - name: Build the fast check derivations
        run: >
          nix build -L
          .#checks.x86_64-linux.webphone
          .#checks.x86_64-linux.format
          .#checks.x86_64-linux.island-js
          .#checks.x86_64-linux.island-lint
          .#checks.x86_64-linux.island-typecheck
          .#checks.x86_64-linux.statix
          .#checks.x86_64-linux.deadnix
          .#checks.x86_64-linux.vulnix-triage
          .#checks.x86_64-linux.webphone-module

  # Ratified dedup ritual (2026-10-11): the -t 1 deep sweep's accepted
  # clones live in .art-dupl-baseline.json (78 groups, re-recorded
  # 2026-10-27 with THIS pinned tool). This gate fails only on clone groups
  # NEW since the baseline; re-baselining is a deliberate registry-protocol
  # act, never a way to silence a red. Re-record ONLY with the pinned
  # version: a baseline written by the local v0.9.x build carries hashes
  # v0.7.2 never produces, so every future run reds on phantom groups
  # (docs/dedup-registry.md, sweep log 2026-10-27).
  dup-gate:
    name: art-dupl check (new clones only)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable

      - name: Install art-dupl at the baseline's tool version
        run: go install github.com/LarsArtmann/art-dupl/cmd/art-dupl@v0.7.2

      - name: Fail on clone groups new since the baseline
        run: "$(go env GOPATH)/bin/art-dupl check . -t 1 --baseline-path .art-dupl-baseline.json"

  # False-green gate (SUPERB error-agents M5, advisory): a fix train's
  # new tests must FAIL on the merge base. continue-on-error keeps this
  # annotation-only until N clean trains justify the deliberate blocking
  # flip — flipping means deleting that flag, never silently tightening.
  reproduce-first:
    name: reproduce-first (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - name: Reproduce the fix train's tests on the merge base
        run: nix develop .#ci -c scripts/reproduce-first-check.sh --base origin/main --head HEAD

  # Tailwind artifact freshness (loginpage-adoption tail, 2026-10-25):
  # nothing failed when the committed tw.css/login.css drifted from their
  # inputs — the 10-25 refresh carried 15 additive utilities no view
  # referenced, and the agent-UX + review trains later changed views
  # without rebuilding. The build is byte-stable by construction (flake-
  # locked nixpkgs tailwind, module-cache sources pinned by go.mod, staged
  # tree, formatter-normalized output), so a rebuild MUST reproduce the
  # committed bytes. ADVISORY for the same reason reproduce-first is: the
  # auto-commit daemon pushes in-flight view edits before a train's tail
  # rebuilds the artifacts, so blocking would red main mid-train; flip to
  # blocking (delete continue-on-error) after clean advisory trains.
  tw-freshness:
    name: tw.css/login.css freshness (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - name: Rebuild both Tailwind artifacts and diff against the committed bytes
        run: |
          nix develop -c scripts/build-tw-css.sh
          git diff --exit-code -- internal/web/assets/tw.css internal/web/assets/login.css
