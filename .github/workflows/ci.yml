name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Fleet policy (cue-policy #CIWorkflow): CI workflows never publish, so
# contents stays read; any additional scope must be declared explicitly.
permissions:
  contents: read

jobs:
  # The forward-pin enabler: proves vendorHash + build of the exact rev.
  # Consumers relock this repo's main on trust; without this job "green
  # at HEAD" is unproven (the 2026-09-24 stale-vendorHash class arrived
  # via a relock and only failed downstream).
  build:
    name: nix build .#webphone
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - name: Build the webphone binary
        run: nix build -L .#webphone

  # Pre-upload contract check (2026-11-19, hub pareto T20): the hub
  # publishes a versioned frontmatter contract
  # (catalog-frontmatter.v<N>.schema.json, byte-asserted into its dist);
  # validating the export HERE turns a schema break into this repo's red
  # instead of a red hub build naming webphone. The contract is VENDORED
  # (docs/contracts/catalog-frontmatter.v2.schema.json) because the hub
  # lives on the LAN (catalog.home.lan) — a GitHub runner can never fetch
  # it, and a red CI on DNS was the 2026-11-19 lesson. Local runs may
  # still pass --contract <live URL> to probe hub drift (this host
  # resolves it); CI pins the copy.
  catalog-contract:
    name: catalog export matches the hub frontmatter contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod

      - name: Export the catalog
        run: go run ./cmd/webphone catalog -o work/out/webphone

      - name: Validate against the vendored frontmatter contract
        run: python3 scripts/check-catalog-contract.py --export work/out/webphone --contract docs/contracts/catalog-frontmatter.v2.schema.json

  # The live smoke (plan T15.5 finding, 2026-10-30): the 6-scenario
  # self-booting suite (restart, boot-failure, ASR, dial-gate, faxcap)
  # never ran in CI — every verdict was a human running it locally. The
  # smoke is loopback-only (whole product, zero PBX), so plain CI can
  # run it against the freshly built binary.
  smoke:
    name: webphone-smoke (live boot)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - name: Build the binary
        run: nix build -L .#webphone

      - name: Run the live smoke against it
        run: |
          nix run nixpkgs#python3 -- scripts/webphone-smoke.py \
            --bin ./result/bin/webphone

  # The fully automated WORKFLOW frontend E2E (2026-11-18 SUPERB train):
  # a real headless Chromium drives the real UI — login front door, tab
  # navigation without reload, composer send, a LIVE inbound webhook
  # appearing through SSE->morph in the open page, thread flags, snippet
  # fills, contacts CRUD through the real forms, the language cookie,
  # the styled 404, and the command palette. DOM assertions only (no
  # screenshots — the visual budget stays with ui-capture). BLOCKING
  # since 2026-11-19: eight consecutive green runs earned the lane its
  # gate (the advisory era is over; a red here is now a red main).
  workflow-e2e:
    name: workflow e2e (browser)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - name: Build the binary
        run: nix build -L .#webphone

      # nix >= 2.34 parses `nixpkgs#python312.withPackages(ps: ...)` as a
      # PATH, so the selenium env is built as a store path first and the
      # plain attrpath shells stay machine-parsed (the PYSEL dance).
      - name: Run the browser workflow journeys
        run: |
          PYSEL=$(nix build --no-link --print-out-paths --impure \
            --expr "(builtins.getFlake \"path:$PWD\").inputs.nixpkgs.legacyPackages.x86_64-linux.python312.withPackages (ps: [ ps.selenium ])")
          nix shell nixpkgs#chromium nixpkgs#chromedriver "$PYSEL" \
            --command python3 scripts/workflow-e2e.py --bin ./result/bin/webphone

  # Go unit/contract tests (cmd + internal). The minimal `ci` devShell
  # provides Go at the go.mod floor; GOTOOLCHAIN=local (set in that
  # shell) forbids surprise toolchain downloads inside the hermetic shell.
  go-tests:
    name: go test -race ./...
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - name: Run the Go test suite
        run: nix develop .#ci -c go test -race ./...

  # Fast flake checks without the VM suites (module-check/vm-tests stay
  # consumer-side; they need KVM and tens of minutes).
  #
  # island-typecheck belongs HERE, not only in a full `nix flake check`:
  # until 2026-10-28 the type gate was green locally and unwired in CI, so
  # a contributor's `go test ./...` and the CI run both stayed ignorant of a
  # red served asset (`typecheck_pin_test.go` guards the CONFIG, never the
  # compiler verdict).
  fast-checks:
    name: fast flake checks (format, island, lints)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The docs-health battery's annotate gate resolves struck rows
          # against git history (hash/tag verdict evidence); the default
          # depth-1 checkout leaves ~2/3 of those references unresolvable
          # and inflated the finding count from 205 (full history) to 373 —
          # past the ratchet, red on every push. The changelog-guard job
          # already needs full history for the same reason.
          fetch-depth: 0

      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - name: Build the fast check derivations
        run: >
          nix build -L
          .#checks.x86_64-linux.webphone
          .#checks.x86_64-linux.format
          .#checks.x86_64-linux.island-js
          .#checks.x86_64-linux.island-lint
          .#checks.x86_64-linux.island-typecheck
          .#checks.x86_64-linux.statix
          .#checks.x86_64-linux.deadnix
          .#checks.x86_64-linux.vulnix-triage
          .#checks.x86_64-linux.webphone-module

      # The docs-health battery. Until 2026-11-07 it was a local habit that a
      # session could skip entirely: the freshness gate could PASS a report
      # with no §f at all, the CHANGELOG bar had no guard, and nothing reddened
      # when the docs rotted. `--check` never mutates (a CI run that formatted
      # first would certify the tree it had just repaired); the battery, the
      # §f precondition and the markdown format check all run here. The
      # table-damage gate SKIPs in CI (it needs the docs-health skill's
      # annotate.go, a local fan-out file) and says so in its matrix.
      - name: Docs-health battery (format + freshness + annotate + routing + cadence)
        run: nix develop -c bash scripts/docs-gates.sh --check

  # The CHANGELOG bar (RATIFIED 2026-10-11) had no guard: the metaengine
  # per-group-cap train landed with no [Unreleased] line and every gate stayed
  # green. PR-only, because the bar is about what a change SET claims; a push
  # to main is already merged and cannot be re-drafted. The guard fails open
  # (WARN + exit 0) when the base ref is unresolvable, so a shallow or
  # first-push checkout cannot red the build for missing history.
  changelog-guard:
    name: CHANGELOG coverage
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Require an [Unreleased] line for product-code changes
        run: bash scripts/changelog-guard.sh "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"

  # Ratified dedup ritual (2026-10-11): the -t 1 deep sweep's accepted
  # clones live in .art-dupl-baseline.json (86 groups, re-recorded
  # 2026-11-04 with THIS pinned tool). This gate fails only on clone groups
  # NEW since the baseline; re-baselining is a deliberate registry-protocol
  # act, never a way to silence a red. Re-record ONLY with the pinned
  # version: a baseline written by the local v0.9.x build carries hashes
  # v0.7.2 never produces, so every future run reds on phantom groups
  # (docs/dedup-registry.md, sweep log 2026-10-27).
  dup-gate:
    name: art-dupl check (new clones only)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: stable

      - name: Install art-dupl at the baseline's tool version
        run: go install github.com/LarsArtmann/art-dupl/cmd/art-dupl@v0.7.2

      - name: Fail on clone groups new since the baseline
        run: "$(go env GOPATH)/bin/art-dupl check . -t 1 --baseline-path .art-dupl-baseline.json"

  # False-green gate (SUPERB error-agents M5, advisory): a fix train's
  # new tests must FAIL on the merge base. continue-on-error keeps this
  # annotation-only until N clean trains justify the deliberate blocking
  # flip — flipping means deleting that flag, never silently tightening.
  reproduce-first:
    name: reproduce-first (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - name: Reproduce the fix train's tests on the merge base
        run: nix develop .#ci -c scripts/reproduce-first-check.sh --base origin/main --head HEAD

  # Tailwind artifact freshness (loginpage-adoption tail, 2026-10-25):
  # nothing failed when the committed tw.css/login.css drifted from their
  # inputs — the 10-25 refresh carried 15 additive utilities no view
  # referenced, and the agent-UX + review trains later changed views
  # without rebuilding. The build is byte-stable by construction (flake-
  # locked nixpkgs tailwind, module-cache sources pinned by go.mod, staged
  # tree, formatter-normalized output), so a rebuild MUST reproduce the
  # committed bytes. ADVISORY for the same reason reproduce-first is: the
  # auto-commit daemon pushes in-flight view edits before a train's tail
  # rebuilds the artifacts, so blocking would red main mid-train; flip to
  # blocking (delete continue-on-error) after clean advisory trains.
  tw-freshness:
    name: tw.css/login.css freshness (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - name: Rebuild both Tailwind artifacts and diff against the committed bytes
        run: |
          nix develop -c scripts/build-tw-css.sh
          git diff --exit-code -- internal/web/assets/tw.css internal/web/assets/login.css
