# mypy posture for scripts/ (buildflow runs plain `mypy`): zero-error bar,
# same as the smoke script's 8-to-0 cleanup. Selenium exists only in the
# ui-capture driver env (see the AGENTS run recipe), never in the lint
# shell — ignore just that package, nothing else.
[mypy]

[mypy-selenium.*]
ignore_missing_imports = True
