# Non-default BuildFlow policy only (rationale per key; do not restate defaults).
#
# env: templ-components (errorpage) requires encoding/json/v2 until Go 1.27
# ships it stable; without the experiment every Go step fails to build.
# GOTOOLCHAIN is NOT set here on purpose: buildflow's preflight says the
# caller's shell WINS over project-side env, and this host exports
# GOTOOLCHAIN=local globally — a project-side `auto` would be a silent
# no-op. Bare `buildflow` on such a host fails every Go step; use
# `scripts/buildflow.sh` (self-healing wrapper) or `nix develop -c
# buildflow`.
#
# Findings baseline for branching-flow (see the UNSKIPPED note below):
# the 19 type-node findings (mixin/dupe/large-struct) cannot carry
# //nolint directives — v0.6.4 ignores every nolint placement on
# TypeDecl nodes (five placements verified 2026-10-11; upstream
# LarsArtmann/branching-flow#12) — so they live here as accepted noise,
# each with its ruling documented as a `branching-flow ... (baselined)`
# comment at the site. Findings that DO honor nolints (statements,
# fields, signatures) are suppressed in-code with reasons instead.
# Baseline refresh: save from the SDK side only
# (`buildflow -s branching-flow --save-baseline`) — the CLI emits
# different finding IDs (upstream branching-flow#13).
#
# GATE COMPLETION (pending tooling): the installed BuildFlow (25b07c4)
# caps SDK detector findings at warning severity, so new
# branching-flow findings do not trip the default error gate. The
# designed fix is error_rules elevation (in BuildFlow source ≥899077a,
# unreleased on this host). When the installed binary knows the key,
# add:
#   error_rules:
#     branching-flow: [COMPOSITION_mixin, DUPLICATE_TYPE, ANTI_PATTERN_large-struct, NIL_POINTER_DEREF, INDEX_OUT_OF_RANGE]
# Global `strict: true` was measured 2026-10-11 and REJECTED: 604
# pre-existing warning findings (bandit 335, govulncheck 94, art-dupl
# 74, …) trip it — strict is fleet-wide, not per-tool.
baseline: .buildflow-baseline.json
#
# tool_paths: govulncheck must be built with the module's Go (1.27).
# BuildFlow resolved a stale go1.26-built nix store copy whose
# source-processing packages cannot load the go1.27 module — 94
# "requires newer Go version" noise rows and ZERO real scans
# (2026-10-11). The ~/go/bin copy is go1.27.2-built (the provider's
# own `go install` InstallHint destination); revisit if it drifts.
# (Value is the DIRECTORY; a binary path is a broken entry that
# silently falls back to PATH — preflight warns.)
tool_paths:
  govulncheck: /home/lars/go/bin
#
# exclude: the SIP island sources in internal/web/assets/island/ AND the
# shell glue (internal/web/assets/shell.js) are owned by the flake's
# treefmt gate (prettier): BuildFlow's oxfmt would reformat them into a
# style prettier rejects, re-breaking checks.format on every fix run —
# the same two-formatters-one-file-set war the static site fought (see
# git history). The vendored sip.min.js is a third-party bundle;
# *_templ.go files are generated code.
exclude:
  - "internal/web/assets/island/**"
  - "internal/web/assets/shell.js"
  - "internal/web/assets/vendor/**"
  - "**/*_templ.go"

