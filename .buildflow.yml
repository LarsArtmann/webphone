# Non-default BuildFlow policy only (rationale per key; do not restate defaults).
#
# env: templ-components (errorpage) requires encoding/json/v2 until Go 1.27
# ships it stable; without the experiment every Go step fails to build.
# GOTOOLCHAIN is NOT set here on purpose: buildflow's preflight says the
# caller's shell WINS over project-side env, and this host exports
# GOTOOLCHAIN=local globally — a project-side `auto` would be a silent
# no-op. Bare `buildflow` on such a host fails every Go step; use
# `scripts/buildflow.sh` (self-healing wrapper) or `nix develop -c
# buildflow`.
#
# build_mode: local default is fast; `nix flake check` (go build + tests in
# the sandbox + treefmt + statix + deadnix) remains the heavyweight gate.
build_mode: fast
#
# exclude: the SIP island sources in internal/web/assets/island/ AND the
# shell glue (internal/web/assets/shell.js) are owned by the flake's
# treefmt gate (prettier): BuildFlow's oxfmt would reformat them into a
# style prettier rejects, re-breaking checks.format on every fix run —
# the same two-formatters-one-file-set war the static site fought (see
# git history). The vendored sip.min.js is a third-party bundle;
# *_templ.go files are generated code.
exclude:
  - "internal/web/assets/island/**"
  - "internal/web/assets/shell.js"
  - "internal/web/assets/vendor/**"
  - "**/*_templ.go"
