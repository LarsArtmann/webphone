# Non-default BuildFlow policy only (rationale per key; do not restate defaults).
#
# build_mode: local default is fast. This repo's real gate is
# `nix flake check` (package build + treefmt + statix + deadnix); it
# realizes in well under a minute, so there is no fast/full split here.
build_mode: fast
#
# exclude: the UI sources in src/ are owned by the flake's treefmt gate
# (nixfmt + prettier, `nix fmt`): BuildFlow's oxfmt reformats them into a
# style prettier rejects, so every fix run would re-break checks.format —
# the same two-formatters-one-file-set war nix-international-telephony
# fought before excluding its webphone assets there. BuildFlow has no
# per-tool exclude key, so this global exclude also removes jscpd/lychee
# coverage of those files — accepted: single-screen app, one HTML file,
# no outbound links (strict CSP allows same-origin only).
exclude:
  - "src/**"

# Whole-tool skips (skip_steps cannot be per-file):
# - pytest-test: no Python exists in this repo; the consuming stack's VM
#   suites exercise the served site end to end.
skip_steps:
  - pytest-test
