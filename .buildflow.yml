# Non-default BuildFlow policy only (rationale per key; do not restate defaults).
#
# env: templ-components (errorpage) requires encoding/json/v2 until Go 1.27
# ships it stable; without the experiment every Go step fails to build.
# GOTOOLCHAIN: auto lets a BARE host run (ambient go 1.26.7 +
# GOTOOLCHAIN=local from the global env) satisfy the go.mod 1.27.1 floor
# by fetching the toolchain; inside the devShell the pinned go is
# already >= the floor, so auto resolves locally and downloads nothing.
env:
  GOEXPERIMENT: jsonv2
  GOTOOLCHAIN: auto
#
# build_mode: local default is fast; `nix flake check` (go build + tests in
# the sandbox + treefmt + statix + deadnix) remains the heavyweight gate.
build_mode: fast
#
# exclude: the SIP island sources in internal/web/assets/island/ AND the
# shell glue (internal/web/assets/shell.js) are owned by the flake's
# treefmt gate (prettier): BuildFlow's oxfmt would reformat them into a
# style prettier rejects, re-breaking checks.format on every fix run —
# the same two-formatters-one-file-set war the static site fought (see
# git history). The vendored sip.min.js is a third-party bundle;
# *_templ.go files are generated code.
exclude:
  - "internal/web/assets/island/**"
  - "internal/web/assets/shell.js"
  - "internal/web/assets/vendor/**"
  - "**/*_templ.go"

# Whole-tool skips (skip_steps cannot be per-file or per-rule):
# - pytest-test: no Python exists; the Go suite plus the upstream browser
#   E2E (owned by the consuming telephony stack) cover this repo.
# - branching-flow: triaged 2026-09-18. Every actionable finding was FIXED
#   (3-way SharedContact split brain consolidated, ICEServer wire mirror
#   removed, Upload/InboundAttachment unified, Webhook/FaxWebhook mixin
#   extracted, shared rowScanner, slices.Reverse, value-typed sessions).
#   The remaining 67 findings are policy opinions that contradict this
#   repo's design, not defects:
#     * PHANTOM_TYPE x62 — wants phantom types for display fields
#       (Body, MimeType, Pages, Unread, Credential…); maximalist churn
#       with zero safety gain for non-identity data.
#     * COMPOSITION_mixin x2 — InboundMessage vs OutboundMessage share
#       fields BY DESIGN (different lifecycles, see internal/domain);
#       fax.Service vs messaging.Service symmetry is intentional.
#     * STRONG_ID x2 — pbx UUIDs are the upstream phone-api wire format,
#       opaque foreign identifiers passed through verbatim.
#     * EXPLICIT_PANIC x1 — go:embed guarantees the subtree; the panic
#       guards a compile-time impossibility (programmer-error invariant).
# - go-structure-linter: triaged 2026-09-18. Actionable findings FIXED
#   (CONTRIBUTING.md, .editorconfig, .gitattributes, README install
#   section, /webphone gitignore). Remaining rules contradict design:
#     * assets-directory — assets intentionally live under internal/web/
#       for go:embed; a root assets/ would break the single-binary build.
#     * go-version — the toolchain is deliberately pinned by flake.nix
#       (nixpkgs go 1.26.7); the linter's auto-repair to 1.27.1 re-creates
#       the toolchain skew templ-components documented (same trap).
#     * golangci-config — BuildFlow's own golangci-lint step owns that
#       responsibility (see the buildflow skill); a hand-curated config
#       would fight auto-configuration.
# - cqrs-lint: triaged 2026-09-18. All findings contradict this repo's
#   design, not defects:
#     * stack/preset x1 — the cqrs-htmx `setup` bundle was rejected
#       DELIBERATELY (AGENTS.md): product identity is the PBX extension +
#       directory password proven by the island's SIP REGISTER; a second
#       event-sourced user database would be a split brain.
#     * dead-import x1 — go-cqrs-lite/* arrive TRANSITIVELY via cqrs-htmx
#       (root-library-only by design); this repo never calls
#       Save/Publish/Dispatch directly, which is exactly the design.
#     * dispatcher/v4 version skew x1 — the v4 pins live in cqrs-htmx's
#       own go.mod; aligning them here would force direct requires and
#       break the root-library-only rule. Upstream concern.
# - nix-hash-fix: buildflow itself warns it computes the right vendorHash
#   but never writes it in this repo layout (10/10 chronic failures) —
#   AGENTS.md documents the manual deviation (placeholder hash →
#   `nix build` → read `got:` → apply, only when go.mod/go.sum changed).
#   The real gate still exists: `nix flake check` builds in the sandbox.
skip_steps:
  - pytest-test
  - branching-flow
  - go-structure-linter
  - cqrs-lint
  - nix-hash-fix
